# nginx 1.31.6 (nginx:alpine): el resolver de Docker (127.0.0.11) + el
# parámetro `resolve` en el upstream permiten re-resolver `backend` cada
# `valid=10s` sin reiniciar nginx al escalar con `docker compose up
# --scale backend=N` (soporte open-source desde nginx 1.27.3, verificado
# contra la versión de esta imagen). La `zone` es obligatoria: sin ella,
# cada worker lleva su propio contador de Round Robin y la distribución
# sale sesgada (lección del Lab07).
resolver 127.0.0.11 valid=10s;

upstream backend_upstream {
    zone backend_zone 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin barra final en proxy_pass: nginx reenvía la URI completa
    # (/api/...) tal cual, que es justo el prefijo que usan las rutas
    # de FastAPI.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
